[build-system]
requires = ["setuptools>=42", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "otaf"
dynamic = ["version"]
description = "OTAF : Open (mechanical) tolerance analysis framework - A comprehensive framework for modeling 3 dimensional overconstrained mechanical assemblies and doing statistical tolerance analysis."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kristof Attila S.", email = "ksimady@sigma-clermont.fr"}
]
urls = { Homepage = "https://github.com/Kramer84/otaf", Documentation = "https://github.com/Kramer84/otaf/wiki" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]

requires-python = ">= 3.10"

dependencies = [
    "numpy",
    "scipy>=1.14.0",
    "sympy",
    "pandas",
    "openturns",
    "matplotlib",
    "tqdm",
    "joblib",
    "beartype",
    "gldpy",
    "pydantic>=2",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

surrogate = [
    "torch",
    "torcheval"
]
viz = [
    "networkx",
    "trimesh",
    "triangle",
    "pyglet<2"
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
    "myst-parser",
    "linkify-it-py",
    "nbsphinx",
    "notebook",
    "pandoc"
]
# Let users install everything with: pip install otaf[all]
all = [
    "torch", "torcheval", "scikit-learn",
    "networkx", "trimesh", "triangle", "pytransform3d", 
    "pyglet<2", "sphinx", "sphinx-autodoc-typehints", 
    "sphinx_rtd_theme", "myst-parser", "linkify-it-py", "nbsphinx", 
    "notebook", "pandoc"
]

[tool.setuptools.dynamic]
# Single source: src/otaf/_version.py (also exposed as otaf.__version__).
version = {attr = "otaf._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# Bug-catching rules (syntax errors, undefined names, bad __all__, redefinitions,
# unused imports/variables, flake8-bugbear, whitespace) and pydocstyle (numpy
# convention, below). See ROADMAP.md.
select = ["E9", "F63", "F7", "F82", "F811", "F401", "F841", "B", "W", "D"]
# zip() without strict=: adding strict=True would raise where the shorter iterable
# is meant to stop the loop; to be decided site by site, not by a blanket rule.
ignore = ["B905"]
# Lets ruff understand `Literal[...]` etc. imported from beartype.typing.
typing-modules = ["beartype.typing"]

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the library only.
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests", "src/otaf"]
# Docstring examples in src/ run as doctests. The surrogate package imports torch
# at module level, so it is not collected (its examples would need torch/GPU).
addopts = "--doctest-modules --ignore=src/otaf/surrogate"
doctest_optionflags = ["NORMALIZE_WHITESPACE"]
markers = [
    "slow: takes more than a few seconds (model construction, small Monte Carlo runs)",
    "gpu: needs torch and/or a GPU; never run in CI or on small machines",
]
