[build-system]
requires = ["setuptools>=42", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "otaf"
version = "0.2"
description = "OTAF : Open (mechanical) tolerance analysis framework - A comprehensive framework for modeling 3 dimensional overconstrained mechanical assemblies and doing statistical tolerance analysis."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Kristof Attila S.", email = "ksimady@sigma-clermont.fr"}
]
urls = { Homepage = "https://github.com/Kramer84/otaf", Documentation = "https://github.com/Kramer84/otaf/wiki" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]

requires-python = ">= 3.10"

dependencies = [
    "numpy",
    "scipy>=1.14.0",
    "sympy",
    "pandas",
    "openturns",
    "matplotlib",
    "tqdm",
    "joblib",
    "beartype",
    "gldpy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

surrogate = [
    "torch",
    "torcheval"
]
viz = [
    "networkx",
    "trimesh",
    "triangle",
    "pyglet<2"
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
    "myst-parser",
    "nbsphinx",
    "notebook",
    "pandoc"
]
# Let users install everything with: pip install otaf[all]
all = [
    "torch", "torcheval", "scikit-learn",
    "networkx", "trimesh", "triangle", "pytransform3d", 
    "pyglet<2", "sphinx", "sphinx-autodoc-typehints", 
    "sphinx_rtd_theme", "myst-parser", "nbsphinx", 
    "notebook", "pandoc"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
# Bug-catching rules only for now (syntax errors, undefined names, bad __all__,
# redefinitions). Widened step by step as the roadmap progresses; see ROADMAP.md.
select = ["E9", "F63", "F7", "F82", "F811"]
# Lets ruff understand `Literal[...]` etc. imported from beartype.typing.
typing-modules = ["beartype.typing"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes more than a few seconds (model construction, small Monte Carlo runs)",
    "gpu: needs torch and/or a GPU; never run in CI or on small machines",
]
